[project]
name = "cicd-rai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "ipykernel>=7.4.0",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicd_rai"]
